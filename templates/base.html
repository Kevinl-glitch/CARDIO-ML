<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CardioML — Cardiovascular Risk Assessment System{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ef4444'><path d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>">
</head>
<body>
  <!-- Header Navbar matching SOP Screenshots -->
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="{{ url_for('index') }}" class="brand">
        <div class="brand-icon">🛡️</div>
        <span>CardioML</span>
      </a>

      <nav>
        <ul class="nav-links">
          <li><a href="{{ url_for('insights') }}" class="nav-link {% if active_page == 'insights' %}active{% endif %}">Data Insights</a></li>
          <li><a href="{{ url_for('model_info') }}" class="nav-link {% if active_page == 'model' %}active{% endif %}">Model Info</a></li>
          <li><a href="{{ url_for('disclaimer') }}" class="nav-link {% if active_page == 'disclaimer' %}active{% endif %}">Disclaimer</a></li>
          <li>
            <a href="{{ url_for('predict') }}" class="btn-pill-action">
              <span>Predict Now</span>
              <span>↗</span>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Content Block -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>CardioML &bull; Computer Engineering Department &bull; MLDL SOP Student Project &bull; Academic Year 2025–26</p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
